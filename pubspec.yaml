name: bitets
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.0.0
  go_router: ^14.8.0
  device_info_plus: ^13.0.0
  share_plus: ^13.1.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  connectivity_plus: ^7.1.1
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^3.2.3
  flutter_launcher_icons: ^0.14.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  assets:
    - assets/AM_InicioSesion.webp
    - assets/logo.webp

flutter_launcher_icons:
  image_path: "assets/logo.webp"
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  adaptive_icon_background: "#D96704"
